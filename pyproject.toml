[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mcp-sap-gui"
version = "0.2.0"
description = "MCP tools for a configured SAP GUI for Windows session"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "mcp==2.1.1", "python-dotenv>=1.1,<2", "pillow>=11.3,<13",
  "pywin32>=310; sys_platform == 'win32'",
  "pyautogui==0.9.54; sys_platform == 'win32'",
  "mss>=10,<12; sys_platform == 'win32'",
]

[project.scripts]
mcp-sap-gui = "sap_gui_server.server:main"

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sap_gui_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live_sap: opt-in desktop/SAP acceptance; never runs by default"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
